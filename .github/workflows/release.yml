name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0) when running manually'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing or debug-fallback
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_MODE=release-keystore"
              echo "KEYSTORE_PASSWORD<<__NEON_KEYSTORE_PASS_EOF__"
              printf '%s\n' "$KEYSTORE_PASSWORD"
              echo "__NEON_KEYSTORE_PASS_EOF__"
              echo "KEY_ALIAS<<__NEON_KEY_ALIAS_EOF__"
              printf '%s\n' "$KEY_ALIAS"
              echo "__NEON_KEY_ALIAS_EOF__"
              echo "KEY_PASSWORD<<__NEON_KEY_PASS_EOF__"
              printf '%s\n' "$KEY_PASSWORD"
              echo "__NEON_KEY_PASS_EOF__"
            } >> "$GITHUB_ENV"
            echo "Signing mode: release-keystore"
          else
            echo "SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::Release keystore secrets are not fully configured; continuing with SIGNING_MODE=debug-fallback."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run lint, unit tests, and assembleRelease
        run: ./gradlew lint test assembleRelease

      - name: Package release APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_src=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1 || true)
          if [ -z "$apk_src" ]; then
            apk_src=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)
          fi
          if [ -z "$apk_src" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          cp "$apk_src" dist/neon-launcher.apk
          (cd dist && sha256sum neon-launcher.apk > neon-launcher.apk.sha256)
          cat dist/neon-launcher.apk.sha256

      - name: Prepare release metadata and signing notice
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag_name="$REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag_name="$INPUT_TAG"
          else
            tag_name="v0.0.0-manual-${RUN_NUMBER}"
          fi

          {
            echo "tag_name=$tag_name"
            echo "body<<__NEON_RELEASE_BODY_EOF__"
            echo "### Download & Integrity Verification"
            echo ""
            echo "- **APK**: \`https://github.com/${REPO_SLUG}/releases/latest/download/neon-launcher.apk\`"
            echo "- **SHA-256**: \`sha256sum -c neon-launcher.apk.sha256\`"
            echo ""
            if [ "${SIGNING_MODE:-debug-fallback}" = "debug-fallback" ]; then
              echo "> [!WARNING]"
              echo "> **Signed with \`debug-fallback\` signing**: Repository keystore secrets (\`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\`, \`KEY_PASSWORD\`) were not configured for this build."
              echo "> If you are upgrading from an APK signed with a different debug or release keystore, Android will reject the update unless you uninstall the existing package first (\`adb uninstall dev.neonlauncher\`)."
            else
              echo "> [!NOTE]"
              echo "> Signed with the repository release keystore (\`release-keystore\`)."
            fi
            echo "__NEON_RELEASE_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          body: ${{ steps.release_meta.outputs.body }}
          files: |
            dist/neon-launcher.apk
            dist/neon-launcher.apk.sha256
