name: Hardware Compatibility Report
description: Share verified test results from a physical TV or TV box (with sanitized scripts/diagnose output).
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Help build an accurate, verified [`docs/COMPATIBILITY.md`](../blob/main/docs/COMPATIBILITY.md) matrix!
        Please run `./scripts/diagnose.sh` (Linux/macOS) or `.\scripts\diagnose.ps1` (Windows) and paste its sanitized Markdown output below.
        **Privacy reminder:** Never paste IP addresses, device serial numbers, MAC addresses, or account names.

  - type: input
    id: brand_model
    attributes:
      label: Brand & Model
      description: Marketing name of your TV, streaming stick, or TV box.
      placeholder: e.g. Brand Model (4K Stick / TV)
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android / Fire OS version & API level
      placeholder: e.g. Android 12 (API 31)
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Compatibility Status
      options:
        - "✅ Default Home — Launches reliably from the remote HOME button"
        - "⚠️ Manual Only — Works when opened manually, but HOME button returns to vendor launcher"
        - "❌ Unsupported — Fails to install, crashes on launch, or unusable"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method Used
      options:
        - TV Downloader app
        - PC ADB (scripts/install)
        - USB drive + file explorer
        - Built from fork via GitHub Actions
    validations:
      required: true

  - type: dropdown
    id: home_method
    attributes:
      label: Default HOME Method Used
      options:
        - In-app Welcome / System HOME chooser / RoleManager
        - Non-destructive ADB (scripts/set-default-launcher)
        - ADB with --disable-stock (pm disable-user on stock launcher)
        - Manual launch only (did not set as default HOME)
    validations:
      required: true

  - type: textarea
    id: diagnose_output
    attributes:
      label: Sanitized `scripts/diagnose` Output
      description: |
        Paste the full Markdown block generated by `./scripts/diagnose.sh` or `.\scripts\diagnose.ps1`.
        `diagnose` automatically omits serial numbers, MACs, IPs, and user accounts.
      placeholder: |
        ### Neon Launcher Device Diagnostics
        - **Device**: ...
        - **Android**: ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Observations & Rollback Test
      description: |
        Note any D-pad quirks (`OK`, `Hold OK`, `Menu`, `Back`), missing app banners, Safe Mode behavior, and confirm whether "Return to Stock Launcher" / `scripts/restore-stock-launcher` worked cleanly.
    validations:
      required: false
